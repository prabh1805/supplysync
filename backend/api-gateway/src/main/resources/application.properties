spring.application.name=api-gateway
server.port=8090
eureka.client.enabled=false

# Routes
spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8082
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/auth/**

spring.cloud.gateway.server.webmvc.routes[1].id=tenant-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/tenants/**

spring.cloud.gateway.server.webmvc.routes[2].id=product-service
spring.cloud.gateway.server.webmvc.routes[2].uri=http://localhost:8083
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/v1/products/**

spring.cloud.gateway.server.webmvc.routes[3].id=inventory-service
spring.cloud.gateway.server.webmvc.routes[3].uri=http://localhost:8084
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/v1/inventory/**

spring.cloud.gateway.server.webmvc.routes[4].id=supplier-service
spring.cloud.gateway.server.webmvc.routes[4].uri=http://localhost:8085
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/v1/suppliers/**

spring.cloud.gateway.server.webmvc.routes[5].id=order-service
spring.cloud.gateway.server.webmvc.routes[5].uri=http://localhost:8086
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/v1/orders/**

spring.cloud.gateway.server.webmvc.routes[6].id=shipment-service
spring.cloud.gateway.server.webmvc.routes[6].uri=http://localhost:8087
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/api/v1/shipments/**

spring.cloud.gateway.server.webmvc.routes[7].id=notification-service
spring.cloud.gateway.server.webmvc.routes[7].uri=http://localhost:8089
spring.cloud.gateway.server.webmvc.routes[7].predicates[0]=Path=/api/v1/notifications/**

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.web=DEBUG
